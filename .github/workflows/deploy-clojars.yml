name: Release & Deploy to Clojars

# Builds the JVM binding of tree-sitter-language-pack for ALL languages and
# deploys it to Clojars as com.blockether/tree-sitter-language-pack.
#
# Grammar sources come from upstream's curated parser-sources bundle (the same
# set kreuzberg-dev publishes from, which compiles cleanly on every platform —
# the raw per-repo clones used by clone_vendors.py do NOT, e.g. norg). The
# `clojure` grammar is then overridden with our own fork
# (Blockether/tree-sitter-clojure) so the pack uses our fork.
#
# Required repo/org secret: CLOJARS_DEPLOY_TOKEN (Clojars deploy token for the
# `blockether-deployer` account, scoped to the com.blockether group).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      languages:
        description: 'TSLP_LANGUAGES to statically compile (curated default; pass "all" for every grammar)'
        default: 'clojure,dart,elixir,java,kotlin,scala,python,javascript,typescript,tsx,go,rust,zig,c,cpp,csharp,ruby,php,swift,lua,bash,html,css,scss,json,yaml,toml,xml,sql,markdown,markdown_inline,dockerfile,regex'
        required: true

permissions:
  contents: write

env:
  # Curated set of the most popular languages (+ JVM/web/data formats a
  # Clojure shop parses). ~52MB native lib vs ~410MB for `all`. Override via the
  # workflow_dispatch input (e.g. "all") to widen. clojure always comes from
  # our fork (see the `sources` job).
  TSLP_LANGUAGES: ${{ github.event.inputs.languages || 'clojure,dart,elixir,java,kotlin,scala,python,javascript,typescript,tsx,go,rust,zig,c,cpp,csharp,ruby,php,swift,lua,bash,html,css,scss,json,yaml,toml,xml,sql,markdown,markdown_inline,dockerfile,regex' }}
  TSLP_LINK_MODE: static
  # Upstream's LAST published parser-sources bundle (they stopped attaching
  # bundles to releases after v1.10.3). Still byte-correct for every curated
  # grammar EXCEPT the ones whose rev moved in language_definitions.json —
  # those are re-sourced per-grammar in the override step below, so the
  # shipped sources always match the pinned revs.
  PARSER_BUNDLE_URL: https://github.com/kreuzberg-dev/tree-sitter-language-pack/releases/download/v1.10.3/parser-sources-1.10.3.tar.zst
  # Grammars re-sourced from their repos at the definitions-pinned rev:
  # clojure (Blockether fork), php + swift (rev-bumped in the v1.12.3 sync),
  # elixir (NEW curated language — structural intel landed with the sync).
  OVERRIDE_LANGS: clojure php swift elixir

jobs:
  sources:
    name: Assemble parser sources (upstream bundle + our clojure fork)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Download upstream parser-sources bundle
        run: |
          curl -fsSL -o /tmp/ps.tar.zst "$PARSER_BUNDLE_URL"
          tar --zstd -xf /tmp/ps.tar.zst   # extracts ./parsers/<lang>/...
          echo "languages in bundle: $(ls parsers | wc -l)"
          test -f parsers/clojure/src/parser.c

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Override drifted grammars (definitions-pinned revs)
        run: |
          python3 scripts/override_grammars.py
          test -f parsers/clojure/src/parser.c
          test -f parsers/php/src/parser.c
          test -f parsers/swift/src/parser.c
          test -f parsers/elixir/src/parser.c

      - uses: actions/upload-artifact@v4
        with:
          name: parser-sources
          path: parsers
          retention-days: 1
          if-no-files-found: error

  natives:
    name: Build native FFI (${{ matrix.rid }})
    needs: sources
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same matrix shape as Blockether/clj-fff & rift-clojure: every platform
          # builds with an explicit --target. The Intel-mac dylib is cross-built
          # inside the macos-arm64 job and uploaded as a second artifact, avoiding
          # a separate scarce macOS runner queue for the same host image.
          - os: ubuntu-latest
            rid: linux-x86_64
            target: x86_64-unknown-linux-gnu
            lib: libts_pack_core_ffi.so
          - os: ubuntu-24.04-arm
            rid: linux-aarch64
            target: aarch64-unknown-linux-gnu
            lib: libts_pack_core_ffi.so
          - os: macos-14
            rid: macos-arm64
            target: aarch64-apple-darwin
            lib: libts_pack_core_ffi.dylib
          - os: windows-latest
            rid: windows-x86_64
            target: x86_64-pc-windows-msvc
            lib: ts_pack_core_ffi.dll
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The repo pins channel 1.95 via rust-toolchain.toml; cargo uses THAT
      # toolchain, not dtolnay's `stable`. Add the (cross-)target to the pinned
      # toolchain so x86_64-apple-darwin etc. have a std library (E0463 otherwise).
      # Run inside the checkout so the rust-toolchain.toml override applies.
      - name: Add Rust target to pinned toolchain
        run: |
          rustup target add ${{ matrix.target }}
          if [ "${{ matrix.rid }}" = "macos-arm64" ]; then
            rustup target add x86_64-apple-darwin
          fi

      - uses: Swatinem/rust-cache@v2

      - name: Download assembled parser sources
        uses: actions/download-artifact@v4
        with:
          name: parser-sources
          path: parsers

      - name: Build FFI library (${{ matrix.target }}, TSLP_LANGUAGES=${{ env.TSLP_LANGUAGES }})
        run: cargo build --locked -p ts-pack-core-ffi --release --target ${{ matrix.target }}

      - name: Stage native lib under its rid
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.rid }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "out/${{ matrix.rid }}/${{ matrix.lib }}"
          ls -la "out/${{ matrix.rid }}"

      - name: Verify macOS dylib architecture
        if: startsWith(matrix.rid, 'macos-')
        run: |
          echo "expected rid: ${{ matrix.rid }}"
          lipo -archs "out/${{ matrix.rid }}/${{ matrix.lib }}"
          file "out/${{ matrix.rid }}/${{ matrix.lib }}"

      - name: Cross-build Intel macOS dylib from the macOS job
        if: matrix.rid == 'macos-arm64'
        run: |
          cargo build --locked -p ts-pack-core-ffi --release --target x86_64-apple-darwin
          mkdir -p out/macos-x86_64
          cp target/x86_64-apple-darwin/release/libts_pack_core_ffi.dylib out/macos-x86_64/libts_pack_core_ffi.dylib
          lipo -archs out/macos-x86_64/libts_pack_core_ffi.dylib
          file out/macos-x86_64/libts_pack_core_ffi.dylib

      - uses: actions/upload-artifact@v4
        if: matrix.rid == 'macos-arm64'
        with:
          name: native-macos-x86_64
          path: out/macos-x86_64/libts_pack_core_ffi.dylib
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/${{ matrix.lib }}
          if-no-files-found: error

  integration-test:
    name: JVM integration gate (static + intel + dynamic grammar)
    needs: natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-it-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-it-${{ runner.os }}-

      - name: Download freshly built linux native
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x86_64
          path: it-native

      # The gate vis's test suite used to be the only line of defence for:
      # drives the FRESHLY BUILT library through the published binding —
      # static grammar (clojure fork), per-language intel (elixir), and a
      # DYNAMIC grammar (haskell) whose load must fetch the manifest+bundle
      # from the pinned release on this cold runner. A broken dynamic path
      # (1.12.3-blockether.1/.2/.3) fails HERE instead of in production.
      - name: Run integration test against the fresh native
        run: |
          LIB=$(find it-native -type f \( -name '*.so' -o -name '*.dylib' \) | head -1)
          test -n "$LIB" || { echo "no native lib artifact found"; exit 1; }
          clojure -T:build compile-java
          TSLP_NATIVE_PATH="$LIB" clojure -M:it

  release:
    name: Deploy native jars + main jar to Clojars
    needs: [natives, integration-test]
    runs-on: ubuntu-latest
    steps:
      # Check out the triggering ref (the tag for v* pushes) so the deployed
      # artifact corresponds to the tag, not to whatever is currently on main.
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives-staging

      - name: Stage natives for per-rid native jars
        shell: bash
        run: |
          dest=target/native-staging
          mkdir -p "$dest"
          # download-artifact extracts each artifact under
          # natives-staging/native-<rid>/... (subdirs may be preserved), so locate
          # the actual library file recursively rather than globbing the top level.
          for d in natives-staging/native-*; do
            [ -d "$d" ] || continue
            rid="${d#natives-staging/native-}"
            mkdir -p "$dest/$rid"
            find "$d" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) \
              -exec cp {} "$dest/$rid/" \;
          done
          echo "=== staged per-rid natives (each ships in its OWN jar) ==="
          find "$dest" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) | sort

      # Compute the deploy version once and reuse it everywhere. For tag pushes
      # this is the tag minus the leading `v`; for manual runs github.ref_name is
      # a branch (e.g. main), so fall back to a unique manual marker.
      - name: Compute deploy version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Deploy version: $V"

      - name: Check if version exists on Clojars
        id: check-clojars
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://repo.clojars.org/com/blockether/tree-sitter-language-pack/$VERSION/tree-sitter-language-pack-$VERSION.jar")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION already exists on Clojars — skipping deploy"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Deploy per-platform native jars to Clojars
        if: steps.check-clojars.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CLOJARS_USERNAME: blockether-deployer
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          for rid in linux-x86_64 linux-aarch64 macos-arm64 macos-x86_64 windows-x86_64; do
            clojure -T:build deploy-native :rid "$rid"
          done

      - name: Build & Deploy main jar to Clojars
        if: steps.check-clojars.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CLOJARS_USERNAME: blockether-deployer
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
